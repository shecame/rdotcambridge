<style>
html, body { margin:0; padding:0; overflow-x:hidden; }

/* ── HOME WRAPPER ────────────────────────────────────────────── */
.home-wrapper {
  position: relative;
  padding-top: 64px;
}

/* ── LEFT: Text panel — fixed to viewport ───────────────────── */
.home_right {
  position: fixed;
  left: 0;
  top: 0;
  width: 50%;
  height: 100vh;
  background: #fff;
  z-index: 5;
  box-sizing: border-box;
}

/* ── STICKY HERO TEXT ────────────────────────────────────────── */
.sticky_item {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 56px 0 75px;
  padding-top: 64px;
  box-sizing: border-box;
}

/* ── RIGHT: Image panel — scrolls normally ──────────────────── */
/* Background applied directly on the element, exactly like the live site.
   background-size:auto fills the full element height.
   background-repeat:repeat tiles if content exceeds one gradient cycle. */
.home_left {
  margin-left: 50%;
  width: 50%;
  position: relative;
  z-index: 2;
  overflow: hidden;
  padding-top: 18vh;
  padding-bottom: 15vh;
  box-sizing: border-box;
  background: linear-gradient(
    #add3f1, #add3f1,
    #deedf9, #deedf9,
    #add3f1, #add3f1,
    #deedf9, #deedf9,
    #add3f1
  );
  background-size: auto;
  background-repeat: repeat;
}

/* ── COLLECTION LIST ─────────────────────────────────────────── */
.collection-list-wrapper { width: 100%; }

.collection-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5vw;
}

.collection-item {
  perspective: 1000px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  margin-bottom: 15vh;
  overflow: visible;
}
.collection-item:last-child { margin-bottom: 0; }

/* ── PROJECT LINK WRAPPER ────────────────────────────────────── */
.project-link {
  display: block;
  width: 100%;
  margin-left: 0;
  height: 49em;
  transform-origin: center center;
  will-change: transform, opacity;
}

/* ── PROJECT IMAGES ───────────────────────────────────────────── */
.project_img {
  width: 100%;
  height: 100%;
  background-size: contain;
  background-position: 50% center;
  background-repeat: no-repeat;
}

.img1 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/6011d26d7c192a4610e144bb_home-Mid.png'); }
.img2 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/6011d1a63578c69ff0ae116c_home-Picato.png'); }
.img3 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/6011d29647cf4eece6f13190_home-Goosehead.png'); }
.img4 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/60abd967c60551b73ab722f4_home-CTrax.png'); }
.img5 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/60bad882d769c94638e6378e_home-Andela.png'); }
.img6 { background-image: url('https://cdn.prod.website-files.com/5ffe013b4ba2cc04235417b4/6011d2d72a416c5952cffb53_home-Comast.png'); }
.collection-item:not(:nth-child(2)) .project-link { height: 39.2em; }

/* ── TYPOGRAPHY — Andela style ───────────────────────────────── */
.home-title {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(44px, 4.6vw, 66px);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 1.0;
  color: var(--ink);
  margin: 0;
}

/* Accent words — italic light, coloured (matches Andela em style) */
.home-title .accent-blue {
  font-style: italic;
  font-weight: 300;
  color: rgb(130, 172, 206);
  text-transform: none;
  letter-spacing: 0;
}
.home-title .accent-gold {
  font-style: italic;
  font-weight: 300;
  color: #f1d002;
  text-transform: none;
  letter-spacing: 0;
}

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 768px) {
  .home_right { position: relative; width: 100%; height: auto; }
  .home_left  { display: none; }
  .sticky_item { height: auto; padding: 80px 32px 56px; }
}
</style>

<script>
(function(){

  /* ── Nav toggle ──────────────────────────────────────────── */
  var hamburger = document.getElementById('hamburger');
  var navPanel  = document.getElementById('navPanel');
  var siteNav   = document.getElementById('siteNav');
  var open = false;

  hamburger.addEventListener('click', function(){
    open = !open;
    hamburger.classList.toggle('open', open);
    navPanel.classList.toggle('open', open);
    siteNav.classList.toggle('panel-open', open);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && open) hamburger.click();
  });

  /* ── Scroll-driven 3D tilt ───────────────────────────────────
     Uses .collection-item (untransformed) for accurate position.
     CSS rotate/translate — clearly visible range of motion.      */

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  var items = document.querySelectorAll('.collection-item');

  function updateTilts() {
    var vph = window.innerHeight;
    items.forEach(function(item) {
      var link = item.querySelector('.project-link');
      if (!link) return;

      // Rect of the untransformed parent — always accurate
      var rect = item.getBoundingClientRect();

      // 0 = bottom of item just reached viewport bottom (entering)
      // 1 = top of item has reached viewport top (exiting)
      var progress = clamp((vph - rect.top) / (vph + rect.height), 0, 1);
      var t = ease(progress);

      // compress animation: fully settled by the time progress reaches 0.4
      var animT = ease(clamp(t / 0.4, 0, 1));
      var tx = lerp(-480, 0, animT);
      var opacity = clamp(animT * 1.5, 0, 1);

      link.style.transform = 'translate3d(' + tx.toFixed(1) + 'px, 0, 0)';
      link.style.opacity = opacity.toFixed(3);
    });
  }

  window.addEventListener('scroll', updateTilts, { passive: true });
  window.addEventListener('resize', updateTilts);
  updateTilts();

})();
</script>
